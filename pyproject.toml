[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-growth-factory"
version = "1.4.0"
description = "Autonomous source-grounded short-form video pipeline with open visual models, reviewed narration, animated captions, and output verification"
requires-python = ">=3.12,<3.14"
dependencies = [
  "requests==2.32.5",
  "Pillow==11.3.0",
  "imageio==2.37.0",
  "imageio-ffmpeg==0.6.0",
]

[project.optional-dependencies]
voice = ["qwen-tts==0.1.1", "soundfile>=0.12,<0.14"]
reviewer = [
  "transformers==4.57.3",
  "accelerate==1.12.0",
  "qwen-omni-utils>=0.0.8",
]
visual = [
  "diffusers==0.39.0",
  "transformers==4.57.3",
  "accelerate==1.12.0",
  "huggingface-hub[hf_xet]>=0.34,<2",
  "safetensors>=0.5,<1",
  "ftfy>=6.3,<7",
  "sentencepiece>=0.2,<1",
  "einops>=0.8,<1",
]
cloud = ["modal>=1.0,<2"]
full = [
  "qwen-tts==0.1.1",
  "soundfile>=0.12,<0.14",
  "transformers==4.57.3",
  "accelerate==1.12.0",
  "qwen-omni-utils>=0.0.8",
  "diffusers==0.39.0",
  "huggingface-hub[hf_xet]>=0.34,<2",
  "safetensors>=0.5,<1",
  "ftfy>=6.3,<7",
  "sentencepiece>=0.2,<1",
  "einops>=0.8,<1",
  "modal>=1.0,<2",
]

[project.scripts]
ai-growth-factory = "factory.cli:main"

[tool.setuptools.packages.find]
include = ["factory*"]
