[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-growth-factory"
version = "1.3.1"
description = "Free-first autonomous cloud video pipeline with narration-synced rendering and output verification"
requires-python = ">=3.12,<3.14"
dependencies = [
  "requests==2.32.5",
  "Pillow==11.3.1",
  "imageio-ffmpeg==0.6.0",
]

[project.optional-dependencies]
voice = ["qwen-tts==0.1.1", "soundfile>=0.12,<0.14"]
reviewer = ["transformers==4.57.3", "accelerate==1.12.0", "qwen-omni-utils>=0.0.8", "gptqmodel==2.0.0"]
cloud = ["modal>=1.0,<2"]

[project.scripts]
ai-growth-factory = "factory.cli:main"

[tool.setuptools.packages.find]
include = ["factory*"]
