name: Recover c39 ViMax Stage-A Checkpoint

on:
  push:
    branches:
      - debug/export-c39-stagea
    paths:
      - ".github/workflows/export-vimax-canary-debug.yml"

permissions:
  contents: read

concurrency:
  group: recover-c39-vimax-stagea
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: modal-production
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "modal==1.5.3"
      - name: Find newest persisted August 9 Stage-A canary
        run: |
          set -euo pipefail
          modal volume ls --json ai-growth-factory-state canaries > canary-list.json
          python - <<'PY' > selected-canary-id.txt
          import re
          from pathlib import Path
          raw = Path('canary-list.json').read_text(encoding='utf-8')
          ids = sorted(set(re.findall(r'20260809T[0-9]{6}Z-[A-Za-z0-9]+', raw)))
          if not ids:
              raise SystemExit('No 2026-08-09 canary IDs found in Modal volume')
          # c39 Stage A is the newest canary created after stale-run cancellation.
          print(ids[-1])
          PY
          echo "Selected canary: $(cat selected-canary-id.txt)"
      - name: Export complete persisted checkpoint
        run: |
          set -euo pipefail
          CANARY=$(cat selected-canary-id.txt)
          mkdir -p recovered-canary
          modal volume get --force ai-growth-factory-state "canaries/${CANARY}" recovered-canary
          find recovered-canary -type f -printf '%P\t%s bytes\n' | sort | tee recovered-files.txt
          test -f recovered-canary/hitl-checkpoint.json
          test -f recovered-canary/keyframe-human-review-dossier.json
          test -f recovered-canary/editorial-timeline.json
          test -d recovered-canary/visual-keyframes
          test "$(find recovered-canary/visual-keyframes -maxdepth 1 -name 'scene-*-keyframe.png' | wc -l)" -eq 20
      - uses: actions/upload-artifact@v4
        with:
          name: recovered-c39-vimax-stagea
          path: |
            canary-list.json
            selected-canary-id.txt
            recovered-files.txt
            recovered-canary
          retention-days: 7
          if-no-files-found: error
