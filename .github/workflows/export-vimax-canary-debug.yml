name: Export ViMax Canary Debug Evidence

on:
  workflow_dispatch:
  push:
    branches:
      - debug/export-canary-20260808-2ffbc229
    paths:
      - ".github/workflows/export-vimax-canary-debug.yml"

permissions:
  contents: read

concurrency:
  group: export-vimax-canary-debug-20260808-2ffbc229
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: modal-production
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "modal==1.5.3"
      - name: Export complete failed canary directory
        run: |
          set -euo pipefail
          rm -rf canary-debug
          mkdir -p canary-debug
          CANARY=20260808T023143Z-2ffbc229
          modal volume get --force ai-growth-factory-state \
            "canaries/${CANARY}" \
            canary-debug
          find canary-debug -type f -printf '%P\n' | sort
      - uses: actions/upload-artifact@v4
        with:
          name: vimax-canary-20260808T023143Z-2ffbc229-debug
          path: canary-debug
          retention-days: 14
          if-no-files-found: error
