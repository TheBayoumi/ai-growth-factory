name: Export ViMax Canary Debug Evidence

on:
  workflow_dispatch:
  push:
    branches:
      - verify/modal-gpu-editorial-v28-20260804
    paths:
      - ".github/workflows/export-vimax-canary-debug.yml"

permissions:
  contents: read

concurrency:
  group: export-vimax-canary-debug
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: modal-production
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "modal==1.5.3"
      - name: Export exact failed canary evidence
        run: |
          set -euo pipefail
          mkdir -p canary-debug
          CANARY=20260807T095758Z-5f3ee714
          for name in \
            canary-failure.json \
            voice-review-manifest.json \
            narration-final-attempt.wav \
            voice-review-final.wav \
            package.json \
            production-preflight.json; do
            modal volume get --force ai-growth-factory-state \
              "canaries/${CANARY}/${name}" \
              "canary-debug/${name}" || true
          done
          find canary-debug -maxdepth 2 -type f -printf '%P\n' | sort
      - uses: actions/upload-artifact@v4
        with:
          name: vimax-canary-20260807T095758Z-5f3ee714-debug
          path: canary-debug
          retention-days: 14
          if-no-files-found: error
