name: Apply ViMax root alignment fix

on:
  push:
    branches:
      - verify/modal-gpu-editorial-v28-20260804
    paths:
      - ".github/workflows/apply-vimax-root-alignment-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verify/modal-gpu-editorial-v28-20260804
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch bounded ViMax compatibility boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          script = Path("scripts/run_vimax_planner.py")
          text = script.read_text(encoding="utf-8")

          marker = "\ndef _install_camera_tree_repair() -> None:\n"
          helper = r'''

def align_camera_parent_items(
    cameras: Sequence[Any],
    parent_items: Sequence[Any],
) -> tuple[list[Any], list[dict[str, Any]]]:
    """Align a known ViMax root-omission shape without guessing arbitrary missing cameras."""
    expected = len(cameras)
    actual = len(parent_items)
    if expected == actual:
        return list(parent_items), []
    if (
        expected > 0
        and actual == expected - 1
        and int(cameras[0].idx) == 0
    ):
        return [None, *list(parent_items)], [
            {
                "camera_idx": 0,
                "issue": "omitted_root_parent_item",
                "old_length": actual,
                "new_length": expected,
                "new_value": None,
            }
        ]
    raise ValueError(
        f"Camera tree response length mismatch: expected {expected}, got {actual}"
    )
'''
          if "def align_camera_parent_items(" not in text:
              if marker not in text:
                  raise SystemExit("camera repair insertion marker not found")
              text = text.replace(marker, helper + marker, 1)

          old_human = '''            camera_module.HumanMessage(\n                content=camera_module.human_prompt_template_select_reference_camera.format(\n                    camera_seq_str=camera_seq_str\n                )\n            ),'''
          new_human = '''            camera_module.HumanMessage(\n                content=(\n                    camera_module.human_prompt_template_select_reference_camera.format(\n                        camera_seq_str=camera_seq_str\n                    )\n                    + f"\\nReturn exactly {len(cameras)} camera_parent_items ordered for "\n                    f"camera indices 0..{len(cameras) - 1}. The first item MUST be null "\n                    "because camera 0 is the root. Do not omit the root entry."\n                )\n            ),'''
          if old_human in text:
              text = text.replace(old_human, new_human, 1)
          elif "Do not omit the root entry" not in text:
              raise SystemExit("camera prompt replacement marker not found")

          old_call = '''        normalized, tree_repairs = sanitize_camera_parent_items(\n            cameras, response.camera_parent_items\n        )\n        self._agf_camera_tree_repairs = [*shape_repairs, *tree_repairs]'''
          new_call = '''        aligned_items, alignment_repairs = align_camera_parent_items(\n            cameras, response.camera_parent_items\n        )\n        normalized, tree_repairs = sanitize_camera_parent_items(\n            cameras, aligned_items\n        )\n        self._agf_camera_tree_repairs = [\n            *shape_repairs,\n            *alignment_repairs,\n            *tree_repairs,\n        ]'''
          if old_call in text:
              text = text.replace(old_call, new_call, 1)
          elif "alignment_repairs = align_camera_parent_items" not in text:
              raise SystemExit("camera alignment call replacement marker not found")

          script.write_text(text, encoding="utf-8")

          test = Path("tests/test_vimax_camera_tree_repair.py")
          t = test.read_text(encoding="utf-8")
          old_import = '''from scripts.run_vimax_planner import (\n    normalize_camera_tree_response_payload,'''
          new_import = '''from scripts.run_vimax_planner import (\n    align_camera_parent_items,\n    normalize_camera_tree_response_payload,'''
          if old_import in t:
              t = t.replace(old_import, new_import, 1)
          elif "align_camera_parent_items," not in t:
              raise SystemExit("test import marker not found")

          test_marker = '''    def test_rejects_response_length_mismatch(self) -> None:\n        with self.assertRaisesRegex(ValueError, "length mismatch"):\n            sanitize_camera_parent_items(self._cameras(), [None])\n\n'''
          tests = '''    def test_aligns_only_omitted_root_parent_item(self) -> None:\n        cameras = self._cameras()\n        items = [\n            self._item(0, 1),\n            self._item(1, 3),\n            self._item(2, 5),\n        ]\n        aligned, repairs = align_camera_parent_items(cameras, items)\n        self.assertIsNone(aligned[0])\n        self.assertEqual(items, aligned[1:])\n        self.assertEqual(["omitted_root_parent_item"], [item["issue"] for item in repairs])\n\n    def test_root_alignment_rejects_other_length_mismatches(self) -> None:\n        with self.assertRaisesRegex(ValueError, "length mismatch"):\n            align_camera_parent_items(self._cameras(), [None])\n\n'''
          if "test_aligns_only_omitted_root_parent_item" not in t:
              if test_marker not in t:
                  raise SystemExit("test insertion marker not found")
              t = t.replace(test_marker, test_marker + tests, 1)
          test.write_text(t, encoding="utf-8")
          PY
      - name: Run targeted regression
        run: python -m unittest tests.test_vimax_camera_tree_repair -v
      - name: Commit compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TheBayoumi"
          git config user.email "107598562+TheBayoumi@users.noreply.github.com"
          git add scripts/run_vimax_planner.py tests/test_vimax_camera_tree_repair.py
          git diff --cached --check
          git commit -m "fix: align omitted ViMax root camera item"
          git push origin HEAD:verify/modal-gpu-editorial-v28-20260804
