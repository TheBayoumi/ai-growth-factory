name: Export ViMax Remotion Canary Artifact

on:
  workflow_dispatch:
  push:
    branches:
      - feat/vimax-remotion-pipeline
    paths:
      - ".github/workflows/export-canary-artifact.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: modal-production
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      CANARY_REMOTE_PATH: canaries/20260806T134940Z-891c0bb6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "modal==1.5.3"
      - name: Download exact canary bundle
        run: modal volume get --force ai-growth-factory-state "$CANARY_REMOTE_PATH" canary-artifact
      - name: List exported evidence
        run: find canary-artifact -maxdepth 4 -type f -printf '%P\n' | sort
      - uses: actions/upload-artifact@v4
        with:
          name: vimax-remotion-canary-20260806T134940Z-891c0bb6
          path: canary-artifact
          retention-days: 14
