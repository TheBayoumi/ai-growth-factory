name: Modal GPU Production Verification

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ startsWith(github.event.pull_request.head.ref, 'verify/modal-gpu-') && 'modal-gpu-production-verification-v6' || format('modal-gpu-nonverification-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  produce-video:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'verify/modal-gpu-')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: modal-production
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Check out merged main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate persistent Modal credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MODAL_TOKEN_ID:-}" || {
            echo "MODAL_TOKEN_ID is missing from modal-production." >&2
            exit 1
          }
          test -n "${MODAL_TOKEN_SECRET:-}" || {
            echo "MODAL_TOKEN_SECRET is missing from modal-production." >&2
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install production client and preflight source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "modal==1.5.3"
          python -m compileall -q factory cloud
          python -c "from factory.production_runtime import install_production_runtime; install_production_runtime(); print('Production runtime import preflight passed')"
          python -c "from factory.visual_prompt import construct_visual_plan; from factory.caption_renderer import write_animated_caption_track; from factory.visual_pipeline import render_visual_plan; print('Autonomous visual pipeline import preflight passed')"
          python scripts/repository_preflight.py

      - name: Verify Modal credential pair
        run: modal token info

      - name: Deploy A10 production worker
        env:
          MODAL_USE_FACTORY_SECRET: "false"
        run: modal deploy cloud/modal_app.py --tag "${GITHUB_SHA}"

      - name: Generate real platform-ready video and capture result
        id: production
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          modal run cloud/modal_app.py --render-canary 2>&1 | tee modal-production-result.txt

      - name: Resolve production artifact identifier
        if: always() && (steps.production.outcome == 'success' || steps.production.outcome == 'failure')
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          result_path = Path("modal-production-result.txt")
          if not result_path.exists():
              raise SystemExit("Modal production output was not created")
          text = result_path.read_text(encoding="utf-8", errors="replace")
          candidates = []
          for line in text.splitlines():
              stripped = line.strip()
              if stripped.startswith("{") and stripped.endswith("}"):
                  try:
                      candidates.append(json.loads(stripped))
                  except json.JSONDecodeError:
                      pass
          if candidates:
              result = candidates[-1]
              canary_id = str(result.get("canary_id") or "")
          else:
              matches = re.findall(r'"canary_id"\s*:\s*"([^"]+)"', text)
              canary_id = matches[-1] if matches else ""
          if not canary_id:
              raise SystemExit("Could not resolve production artifact ID")
          Path("canary-id.txt").write_text(canary_id, encoding="utf-8")
          print(canary_id)
          PY

      - name: Download exact GPU output bundle
        if: always() && hashFiles('canary-id.txt') != ''
        shell: bash
        run: |
          set -euo pipefail
          canary_id=$(cat canary-id.txt)
          rm -rf production-video
          mkdir -p production-video
          modal volume get --force ai-growth-factory-state "canaries/${canary_id}/" production-video/
          test -n "$(find production-video -type f -print -quit)" || {
            echo "Modal volume download produced no files." >&2
            exit 1
          }
          find production-video -type f -print | sort

      - name: Upload production video artifact
        if: always() && (steps.production.outcome == 'success' || steps.production.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: platform-ready-production-video-${{ github.run_attempt }}
          path: |
            production-video/
            modal-production-result.txt
            canary-id.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce production output completeness
        if: always() && (steps.production.outcome == 'success' || steps.production.outcome == 'failure')
        shell: bash
        env:
          PRODUCTION_STEP_OUTCOME: ${{ steps.production.outcome }}
        run: |
          set -euo pipefail
          if [ "${PRODUCTION_STEP_OUTCOME}" != "success" ]; then
            failure=$(find production-video -name canary-failure.json -type f -print -quit 2>/dev/null || true)
            if [ -n "${failure}" ]; then
              cat "${failure}"
            fi
            echo "The real Modal production process failed." >&2
            exit 1
          fi
          result_file=$(find production-video -name canary-result.json -type f -print -quit)
          test -n "${result_file}"
          python - "${result_file}" <<'PY'
          import json
          import sys
          from pathlib import Path

          result_path = Path(sys.argv[1])
          root = result_path.parent
          result = json.loads(result_path.read_text(encoding="utf-8"))
          if result.get("status") != "verified_render_canary":
              raise SystemExit(f"Production output was not verified: {result}")
          required = (
              "video.mp4",
              "narration.wav",
              "thumbnail.png",
              "voice-review-manifest.json",
              "video-qc-report.json",
              "package.json",
              "visual-plan.json",
              "keyframe-manifest.json",
              "scene-media-manifest.json",
              "animated-captions.ass",
              "animated-captions.json",
              "visual-composition-manifest.json",
          )
          missing = [name for name in required if not (root / name).exists()]
          if missing:
              raise SystemExit("Production artifact is incomplete: " + ", ".join(missing))
          keyframes = sorted((root / "visual-keyframes").glob("scene-*-keyframe.png"))
          if len(keyframes) != 6:
              raise SystemExit(f"Expected six generated keyframes, received {len(keyframes)}")
          visuals = result.get("visuals") or {}
          if visuals.get("wan_scene_count") != 3:
              raise SystemExit(f"Expected three Wan hero scenes: {visuals}")
          if visuals.get("captions_baked_into_generated_media") is not False:
              raise SystemExit("Generated media must be text-free; captions belong to the ASS layer")
          if visuals.get("caption_rendering") != "separate_animated_ass_layer":
              raise SystemExit(f"Animated caption contract is missing: {visuals}")
          print(json.dumps(result, indent=2, ensure_ascii=False))
          PY
