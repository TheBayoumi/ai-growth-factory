name: Modal GPU Production Verification

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read
  actions: read

concurrency:
  group: modal-gpu-production-verification
  cancel-in-progress: false

jobs:
  deploy-canary:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'verify/modal-gpu-')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: modal-production
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Check out merged main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate persistent Modal credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MODAL_TOKEN_ID:-}" || {
            echo "MODAL_TOKEN_ID is missing from the modal-production GitHub environment." >&2
            exit 1
          }
          test -n "${MODAL_TOKEN_SECRET:-}" || {
            echo "MODAL_TOKEN_SECRET is missing from the modal-production GitHub environment." >&2
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1

      - name: Install and verify source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . coverage "modal==1.5.3"
          python -m compileall -q factory cloud tests
          python -m unittest discover -s tests -v
          python scripts/repository_preflight.py

      - name: Verify Modal credential pair
        run: modal token info

      - name: Deploy T4 production worker
        env:
          MODAL_USE_FACTORY_SECRET: "false"
        run: modal deploy cloud/modal_app.py --tag "${GITHUB_SHA}"

      - name: Run real render-only production canary and capture result
        id: canary
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          modal run cloud/modal_app.py --render-canary 2>&1 | tee modal-canary-result.txt

      - name: Resolve canary artifact identifier
        if: always() && (steps.canary.outcome == 'success' || steps.canary.outcome == 'failure')
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          result_path = Path("modal-canary-result.txt")
          if not result_path.exists():
              raise SystemExit("Modal canary output was not created")
          text = result_path.read_text(encoding="utf-8", errors="replace")
          candidates = []
          for line in text.splitlines():
              stripped = line.strip()
              if stripped.startswith("{") and stripped.endswith("}"):
                  try:
                      candidates.append(json.loads(stripped))
                  except json.JSONDecodeError:
                      pass
          if candidates:
              result = candidates[-1]
              canary_id = str(result.get("canary_id") or "")
          else:
              matches = re.findall(r'"canary_id"\s*:\s*"([^"]+)"', text)
              canary_id = matches[-1] if matches else ""
          if not canary_id:
              raise SystemExit("Could not resolve canary_id from Modal output")
          Path("canary-id.txt").write_text(canary_id, encoding="utf-8")
          print(canary_id)
          PY

      - name: Download exact GPU output bundle
        if: always() && hashFiles('canary-id.txt') != ''
        shell: bash
        run: |
          set -euo pipefail
          canary_id=$(cat canary-id.txt)
          modal volume get --force ai-growth-factory-state "canaries/${canary_id}" production-canary

      - name: Upload production canary artifact
        if: always() && (steps.canary.outcome == 'success' || steps.canary.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: modal-production-canary-${{ github.run_attempt }}
          path: |
            production-canary/
            modal-canary-result.txt
            canary-id.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce canary success
        if: always() && (steps.canary.outcome == 'success' || steps.canary.outcome == 'failure')
        shell: bash
        env:
          CANARY_STEP_OUTCOME: ${{ steps.canary.outcome }}
        run: |
          set -euo pipefail
          if [ "${CANARY_STEP_OUTCOME}" != "success" ]; then
            if [ -f production-canary/canary-failure.json ]; then
              cat production-canary/canary-failure.json
            fi
            echo "The real Modal canary process failed." >&2
            exit 1
          fi
          test -f production-canary/canary-result.json
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("production-canary")
          result = json.loads((root / "canary-result.json").read_text(encoding="utf-8"))
          if result.get("status") != "verified_render_canary":
              raise SystemExit(f"Canary was not verified: {result}")
          required = (
              "video.mp4",
              "narration.wav",
              "voice-review-manifest.json",
              "video-qc-report.json",
              "package.json",
          )
          missing = [name for name in required if not (root / name).exists()]
          if missing:
              raise SystemExit("Canary artifact is incomplete: " + ", ".join(missing))
          print(json.dumps(result, indent=2, ensure_ascii=False))
          PY
