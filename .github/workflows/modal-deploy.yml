name: Deploy Modal GPU Worker

on:
  workflow_dispatch:
    inputs:
      run_private_canary:
        description: Run a private canary after deployment
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: modal-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: modal-production
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Check out verified main
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo "MODAL_TOKEN_ID is missing"; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo "MODAL_TOKEN_SECRET is missing"; exit 1; }
      - name: Install Modal
        run: python -m pip install "modal==1.5.3"
      - name: Repository preflight
        run: python scripts/repository_preflight.py
      - name: Deploy scheduled T4 worker
        run: modal deploy cloud/modal_app.py
      - name: Run private canary
        if: ${{ inputs.run_private_canary }}
        run: |
          set -o pipefail
          modal run cloud/modal_app.py --canary | tee modal-canary-result.txt
      - name: Upload canary invocation log
        if: ${{ always() && inputs.run_private_canary }}
        uses: actions/upload-artifact@v4
        with:
          name: modal-canary-result
          path: modal-canary-result.txt
          if-no-files-found: warn
          retention-days: 14
