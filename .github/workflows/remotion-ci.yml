name: ViMax Remotion migration CI

on:
  pull_request:
    paths:
      - "renderer/**"
      - "cloud/modal_vimax_temporal_canary.py"
      - "cloud/modal_vimax_hitl_preproduction.py"
      - "factory/remotion_*.py"
      - "factory/vimax_planner.py"
      - "factory/production_runtime.py"
      - "factory/production_package_boundary_v54.py"
      - "factory/production_package_capacity_v46.py"
      - "factory/production_spoken_duration_capacity_v51.py"
      - "factory/production_remotion_renderer_v45.py"
      - "factory/production_remotion_motion_qc_v53.py"
      - "factory/production_remotion_editorial_transitions_v56.py"
      - "factory/production_remotion_transition_policy_v57.py"
      - "factory/production_vimax_planning_v45.py"
      - "factory/production_vimax_visual_authority_v52.py"
      - "factory/production_vimax_temporal_video_v55.py"
      - "factory/production_vimax_editorial_grammar_v58.py"
      - "factory/production_vimax_infrastructure_grammar_v62.py"
      - "factory/production_vimax_unified_storyboard_v64.py"
      - "factory/production_visual_reviewer_resilience_v59.py"
      - "factory/production_visual_review_transport_v60.py"
      - "factory/production_human_review_handoff_v61.py"
      - "factory/production_keyframe_human_gate_v63.py"
      - "factory/production_visual_audit_v45.py"
      - "factory/production_transition_evidence_v48.py"
      - "factory/production_visual_review_json_v49.py"
      - "factory/production_voice_micro_clause_fallback_v45.py"
      - "factory/production_voice_orphan_recovery_v50.py"
      - "factory/production_voice_review_convergence_v47.py"
      - "factory/production_voice_technical_identifier_v42.py"
      - "factory/production_voice_technical_pacing_v43.py"
      - "scripts/run_vimax_planner.py"
      - "tests/test_remotion_contract.py"
      - "tests/test_production_package_boundary_v54.py"
      - "tests/test_production_package_capacity_v46.py"
      - "tests/test_production_spoken_duration_capacity_v51.py"
      - "tests/test_production_transition_evidence_v48.py"
      - "tests/test_production_remotion_editorial_transitions_v56_v57.py"
      - "tests/test_production_vimax_visual_authority_v52.py"
      - "tests/test_production_vimax_temporal_video_v55.py"
      - "tests/test_production_vimax_editorial_grammar_v58.py"
      - "tests/test_production_vimax_infrastructure_grammar_v62.py"
      - "tests/test_production_vimax_unified_storyboard_v64.py"
      - "tests/test_production_visual_reviewer_resilience_v59.py"
      - "tests/test_production_visual_review_transport_v60.py"
      - "tests/test_production_human_review_handoff_v61.py"
      - "tests/test_production_keyframe_human_gate_v63.py"
      - "tests/test_production_remotion_motion_qc_v53.py"
      - "tests/test_visual_review_json_v49.py"
      - "tests/test_voice_micro_clause_fallback_v45.py"
      - "tests/test_voice_orphan_recovery_v50.py"
      - "tests/test_voice_review_convergence_v47.py"
      - "tests/test_production_voice_technical_identifier_v42.py"
      - "tests/test_production_voice_technical_pacing_v43.py"
      - "tests/test_vimax_planner.py"
      - "tests/test_vimax_camera_tree_repair.py"
      - ".github/workflows/remotion-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg runtime
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . coverage
      - name: Compile
        run: python -m compileall -q factory api tests cloud scripts
      - name: Unit and integration tests
        run: coverage run --branch -m unittest discover -s tests -v
      - name: Coverage report
        run: coverage report --fail-under=65
      - name: Repository preflight
        run: python scripts/repository_preflight.py

  renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: renderer/package.json
      - name: Install exact renderer dependencies
        working-directory: renderer
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: TypeScript build
        working-directory: renderer
        run: npm run build
      - name: Contract tests
        working-directory: renderer
        run: npm test
