name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Exact branch, tag, or SHA to verify
        required: true
        default: main
        type: string
      run_production_review:
        description: Spend Modal quota on one full review render
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.event_name }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg runtime
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . coverage
      - name: Compile
        run: python -m compileall -q factory api tests cloud scripts
      - name: Unit and integration tests
        run: coverage run --branch -m unittest discover -s tests -v
      - name: Coverage report
        run: coverage report --fail-under=65
      - name: Secret-pattern check
        run: python scripts/repository_preflight.py

  production-verification:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.run_production_review
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: modal-production
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Check out exact requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve immutable review SHA
        shell: bash
        run: echo "REVIEW_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate persistent Modal credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MODAL_TOKEN_ID:-}" || {
            echo "MODAL_TOKEN_ID is missing from the modal-production GitHub environment." >&2
            exit 1
          }
          test -n "${MODAL_TOKEN_SECRET:-}" || {
            echo "MODAL_TOKEN_SECRET is missing from the modal-production GitHub environment." >&2
            exit 1
          }

      - name: Set up production client
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install production client and preflight source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "modal==1.5.3"
          python -m compileall -q factory api cloud scripts
          python -c "from factory.production_runtime import install_production_runtime; install_production_runtime(); print('Production runtime import preflight passed')"
          python scripts/repository_preflight.py
          python scripts/trend_preflight.py

      - name: Verify Modal credential pair
        run: modal token info

      - name: Deploy exact requested ref to isolated Modal tag
        env:
          MODAL_USE_FACTORY_SECRET: "false"
        run: modal deploy cloud/modal_app.py --tag "${REVIEW_SHA}"

      - name: Generate exact pre-merge production video
        id: production
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          modal run cloud/modal_app.py --render-canary 2>&1 | tee modal-production-result.txt

      - name: Resolve generated artifact identifier
        if: always() && (steps.production.outcome == 'success' || steps.production.outcome == 'failure')
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          result_path = Path("modal-production-result.txt")
          if not result_path.exists():
              raise SystemExit("Modal production output was not created")
          text = result_path.read_text(encoding="utf-8", errors="replace")
          candidates = []
          for line in text.splitlines():
              stripped = line.strip()
              if stripped.startswith("{") and stripped.endswith("}"):
                  try:
                      candidates.append(json.loads(stripped))
                  except json.JSONDecodeError:
                      pass
          if candidates:
              canary_id = str(candidates[-1].get("canary_id") or "")
          else:
              matches = re.findall(r'"canary_id"\s*:\s*"([^"]+)"', text)
              canary_id = matches[-1] if matches else ""
          if not canary_id:
              raise SystemExit("Could not resolve canary_id from Modal output")
          Path("canary-id.txt").write_text(canary_id, encoding="utf-8")
          print(canary_id)
          PY

      - name: Download exact generated video bundle
        if: always() && hashFiles('canary-id.txt') != ''
        shell: bash
        run: |
          set -euo pipefail
          canary_id=$(cat canary-id.txt)
          rm -rf production-video
          mkdir -p production-video
          modal volume get --force ai-growth-factory-state "canaries/${canary_id}/" production-video/
          test -n "$(find production-video -type f -print -quit)" || {
            echo "Modal volume download produced no production files." >&2
            exit 1
          }
          find production-video -type f -print | sort

      - name: Upload exact pre-merge production artifact
        if: always() && (steps.production.outcome == 'success' || steps.production.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: platform-ready-production-video-${{ github.run_attempt }}
          path: |
            production-video/
            modal-production-result.txt
            canary-id.txt
            trend-preflight.json
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce profile-driven editorial output
        if: always() && (steps.production.outcome == 'success' || steps.production.outcome == 'failure')
        shell: bash
        env:
          PRODUCTION_STEP_OUTCOME: ${{ steps.production.outcome }}
        run: |
          set -euo pipefail
          if [ "${PRODUCTION_STEP_OUTCOME}" != "success" ]; then
            failure=$(find production-video -name canary-failure.json -type f -print -quit 2>/dev/null || true)
            if [ -n "${failure}" ]; then cat "${failure}"; fi
            echo "The real Modal production generation failed." >&2
            exit 1
          fi
          result_file=$(find production-video -name canary-result.json -type f -print -quit)
          test -n "${result_file}"
          python - "${result_file}" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          result_path = Path(sys.argv[1])
          root = result_path.parent
          result = json.loads(result_path.read_text(encoding="utf-8"))
          if result.get("status") != "verified_render_canary":
              raise SystemExit(f"Production output was not verified: {result}")
          required = (
              "video.mp4", "narration.wav", "thumbnail.png",
              "voice-review-manifest.json", "video-qc-report.json", "package.json",
              "trend-snapshot.json", "visual-plan.json", "keyframe-manifest.json",
              "scene-media-manifest.json", "animated-captions.ass",
              "animated-captions.json", "visual-composition-manifest.json",
              "visual-pipeline-manifest.json", "visual-compositor.log",
              "background-music.wav",
              "static-preflight.json", "production-preflight.json",
              "preflight-captions.ass", "preflight-captions.json",
              "preflight-animatic.mp4", "preflight-composition-manifest.json",
          )
          missing = [name for name in required if not (root / name).exists()]
          if missing:
              raise SystemExit("Production artifact is incomplete: " + ", ".join(missing))

          composition = json.loads((root / "visual-composition-manifest.json").read_text(encoding="utf-8"))
          contract = composition.get("editorial_contract") or {}
          contract_sha = hashlib.sha256(
              json.dumps(
                  contract,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=False,
              ).encode("utf-8")
          ).hexdigest()
          static_preflight = json.loads(
              (root / "static-preflight.json").read_text(encoding="utf-8")
          )
          production_preflight = json.loads(
              (root / "production-preflight.json").read_text(encoding="utf-8")
          )
          if static_preflight.get("status") != "passed":
              raise SystemExit(f"Static preflight did not pass: {static_preflight}")
          if static_preflight.get("phase") != "static_before_tts":
              raise SystemExit("Static preflight ran at the wrong pipeline phase")
          if production_preflight.get("status") != "passed":
              raise SystemExit(f"Exact production preflight did not pass: {production_preflight}")
          if production_preflight.get("phase") != "exact_before_visual_inference":
              raise SystemExit("Exact preflight ran at the wrong pipeline phase")
          preflight_contracts = {
              str(static_preflight.get("quality_contract_sha256") or ""),
              str(production_preflight.get("quality_contract_sha256") or ""),
              contract_sha,
          }
          if preflight_contracts != {contract_sha}:
              raise SystemExit(
                  "Static preflight, exact animatic, and final render used different contracts"
              )
          animatic_sha = hashlib.sha256(
              (root / "preflight-animatic.mp4").read_bytes()
          ).hexdigest()
          if animatic_sha != production_preflight.get("animatic_sha256"):
              raise SystemExit("Preflight animatic digest does not match its manifest")
          if int(production_preflight.get("transition_count", -1)) != int(
              production_preflight.get("shot_count", 0)
          ) - 1:
              raise SystemExit("Preflight animatic did not realize every planned transition")
          contract_fields = (
              "name", "minimum_shots", "target_shots", "maximum_shots",
              "minimum_video_seconds", "maximum_video_seconds",
              "minimum_shot_seconds", "maximum_shot_seconds",
              "first_ten_seconds_minimum_shots", "wan_shots",
              "minimum_wpm", "maximum_wpm", "maximum_tempo_factor",
              "caption_minimum_seconds", "maximum_single_word_cues",
              "allow_asset_looping", "allow_destructive_caption_matte",
          )
          missing_contract = [field for field in contract_fields if field not in contract]
          if missing_contract:
              raise SystemExit(
                  "Rendered editorial contract is incomplete: " + ", ".join(missing_contract)
              )
          minimum_shots = int(contract["minimum_shots"])
          target_shots = int(contract["target_shots"])
          maximum_shots = int(contract["maximum_shots"])
          maximum_shot_seconds = float(contract["maximum_shot_seconds"])
          minimum_shot_seconds = float(contract["minimum_shot_seconds"])
          minimum_video_seconds = float(contract["minimum_video_seconds"])
          maximum_video_seconds = float(contract["maximum_video_seconds"])
          opening_minimum = int(contract["first_ten_seconds_minimum_shots"])
          required_wan_shots = int(contract["wan_shots"])
          if not 8 <= minimum_shots <= target_shots <= maximum_shots <= 30:
              raise SystemExit(f"Rendered shot-count contract is invalid: {contract}")
          if maximum_shots - target_shots > 8:
              raise SystemExit(f"Rendered hard shot capacity is excessively loose: {contract}")
          if contract["allow_asset_looping"] is not False:
              raise SystemExit("Rendered profile permits source-asset looping")
          if contract["allow_destructive_caption_matte"] is not False:
              raise SystemExit("Rendered profile permits destructive caption mattes")
          duration_seconds = float((result.get("video_qc") or {}).get("duration_seconds") or 0.0)
          if not minimum_video_seconds <= duration_seconds <= maximum_video_seconds:
              raise SystemExit(
                  f"Video duration {duration_seconds:.3f}s is outside "
                  f"{minimum_video_seconds:.1f}-{maximum_video_seconds:.1f}s"
              )

          shots = composition.get("shots") or []
          if not minimum_shots <= len(shots) <= maximum_shots:
              raise SystemExit(
                  f"Expected {minimum_shots}-{maximum_shots} editorial shots from "
                  f"{contract.get('name')}, received {len(shots)}"
              )
          if int(composition.get("realized_shot_count", -1)) != len(shots):
              raise SystemExit("Composition manifest realized_shot_count is inconsistent")
          if sum(float(item.get("start_seconds", 99)) < 10.0 for item in shots) < opening_minimum:
              raise SystemExit(
                  f"The first ten seconds contain fewer than {opening_minimum} unique shots"
              )
          if max(float(item.get("duration_seconds", 99)) for item in shots) > maximum_shot_seconds + 0.02:
              raise SystemExit(
                  f"An editorial shot exceeds the {maximum_shot_seconds:.2f} second profile ceiling"
              )
          if min(float(item.get("duration_seconds", 0)) for item in shots) < minimum_shot_seconds - 0.02:
              raise SystemExit(
                  f"An editorial shot is below the {minimum_shot_seconds:.2f} second profile floor"
              )
          required_shot_fields = (
              "shot_id", "beat_index", "segment_id", "package_scene_index", "semantic_claim"
          )
          if any(any(field not in item for field in required_shot_fields) for item in shots):
              raise SystemExit("Editorial shot-to-narration identity fields are incomplete")
          if [int(item["shot_id"]) for item in shots] != list(range(len(shots))):
              raise SystemExit("Editorial shot IDs are not contiguous")

          visual_plan = json.loads((root / "visual-plan.json").read_text(encoding="utf-8"))
          visual_scenes = sorted(
              visual_plan.get("scenes") or [],
              key=lambda item: int(item.get("scene_index", -1)),
          )
          if len(visual_scenes) != len(shots):
              raise SystemExit("Visual plan does not contain exactly one scene per editorial shot")
          for shot, scene in zip(shots, visual_scenes, strict=True):
              claim = " ".join(str(shot.get("semantic_claim") or "").split()).casefold()
              prompt = " ".join(str(scene.get("image_prompt") or "").split()).casefold()
              if not claim or claim not in prompt:
                  raise SystemExit(
                      f"Shot {shot.get('shot_id')} is not aligned to its exact spoken claim"
                  )

          package = json.loads((root / "package.json").read_text(encoding="utf-8"))
          evidence = package.get("source_evidence") or []
          evidence_urls = {str(item.get("url") or "") for item in evidence}
          if evidence_urls != set(package.get("source_urls") or []):
              raise SystemExit("Package does not preserve evidence for every selected source URL")
          if any(not str(item.get("authority") or "").strip() for item in evidence):
              raise SystemExit("One or more source records are missing authorial authority")
          narration = " ".join(str(package.get("narration") or "").split())
          if re.search(
              r"\b(?:fostering|enabling|supporting|driving|advancing|encouraging)\s+"
              r"(?:continued|ongoing|further)\s+[A-Z][^.?!]{8,}",
              narration,
          ):
              raise SystemExit("Narration contains a malformed pasted-title transition")
          if composition.get("source_asset_looping") is not False:
              raise SystemExit("Source-asset looping is enabled")
          if composition.get("destructive_caption_matte") is not False:
              raise SystemExit("Destructive caption matte is enabled")
          music = composition.get("background_music") or {}
          if music.get("mixed_beneath_reviewed_narration") is not True:
              raise SystemExit("The reviewed narration has no production music bed")
          if "-stream_loop" in (root / "visual-compositor.log").read_text(
              encoding="utf-8", errors="replace"
          ):
              raise SystemExit("FFmpeg source-video looping was detected")

          keyframes = sorted((root / "visual-keyframes").glob("scene-*-keyframe.png"))
          if len(keyframes) != len(shots):
              raise SystemExit(
                  f"Expected one unique keyframe per shot: {len(keyframes)} vs {len(shots)}"
              )
          media = json.loads((root / "scene-media-manifest.json").read_text(encoding="utf-8"))
          assets = media.get("assets") or []
          hashes = [str(item.get("sha256") or "") for item in assets]
          if len(hashes) != len(set(hashes)):
              raise SystemExit("A scene-media asset was reused")
          actual_wan_shots = sum(str(item.get("media_type")) == "video" for item in assets)
          if actual_wan_shots != required_wan_shots:
              raise SystemExit(
                  f"Expected {required_wan_shots} Wan hero shots from the rendered profile, "
                  f"received {actual_wan_shots}"
              )
          if int(composition.get("realized_wan_shots", -1)) != actual_wan_shots:
              raise SystemExit("Composition manifest realized_wan_shots is inconsistent")

          voice = json.loads((root / "voice-review-manifest.json").read_text(encoding="utf-8"))
          wpm = float((voice.get("metrics") or {}).get("estimated_wpm") or 0.0)
          minimum_wpm = float(contract["minimum_wpm"])
          maximum_wpm = float(contract["maximum_wpm"])
          if not minimum_wpm <= wpm <= maximum_wpm:
              raise SystemExit(
                  f"Voice pace {wpm:.2f} WPM is outside {minimum_wpm:.0f}-{maximum_wpm:.0f}"
              )
          maximum_tempo_factor = float(contract["maximum_tempo_factor"])
          for event in voice.get("reviews") or []:
              factor = float(event.get("factor") or 1.0)
              if factor > maximum_tempo_factor + 0.000001:
                  raise SystemExit(
                      f"Tempo correction {factor:.3f} exceeds {maximum_tempo_factor:.3f}"
                  )

          captions = json.loads((root / "animated-captions.json").read_text(encoding="utf-8"))
          if captions.get("layout_version") != "v32-pixel-fitted-two-line":
              raise SystemExit("Captions did not use the pixel-fitted layout")
          if captions.get("all_cues_fit") is not True or captions.get("all_rendered_cues_fit") is not True:
              raise SystemExit("Rendered caption bounds did not pass")
          cues = captions.get("cues") or []
          if any("rendered_bbox_pixels" not in item for item in cues):
              raise SystemExit("Caption cues lack rendered bounding-box evidence")
          one_word = sum(int(item.get("word_count") or 0) == 1 for item in cues)
          maximum_one_word = int(contract["maximum_single_word_cues"])
          if one_word > maximum_one_word:
              raise SystemExit(
                  f"Caption track contains {one_word} isolated one-word cues; "
                  f"profile allows {maximum_one_word}"
              )
          minimum_caption_seconds = float(contract["caption_minimum_seconds"])
          if any(
              float(item["end_seconds"]) - float(item["start_seconds"])
              < minimum_caption_seconds - 0.001
              for item in cues
          ):
              raise SystemExit(
                  f"Caption track contains a cue shorter than {minimum_caption_seconds:.2f} seconds"
              )

          video_qc = result.get("video_qc") or {}
          if video_qc.get("passed") is not True or video_qc.get("failures"):
              raise SystemExit(f"Production motion/encoding QC did not pass: {video_qc}")
          if video_qc.get("width") != 1080 or video_qc.get("height") != 1920:
              raise SystemExit(f"Production video is not 1080x1920: {video_qc}")
          if float(video_qc.get("fps", 0.0)) < 29.0:
              raise SystemExit(f"Production frame rate is below 30 fps: {video_qc}")
          visual_pipeline = json.loads(
              (root / "visual-pipeline-manifest.json").read_text(encoding="utf-8")
          )
          preflight_binding = visual_pipeline.get("preflight") or {}
          if preflight_binding.get("status") != "passed":
              raise SystemExit("Visual inference was not bound to a passing preflight")
          if preflight_binding.get("quality_contract_sha256") != contract_sha:
              raise SystemExit("Visual inference used a different contract than preflight")
          environment_families = visual_pipeline.get("environment_families") or {}
          if len(environment_families) < 4:
              raise SystemExit(
                  f"Visual plan lacks environment diversity: {environment_families}"
              )
          print(json.dumps(result, indent=2, ensure_ascii=False))
          PY
