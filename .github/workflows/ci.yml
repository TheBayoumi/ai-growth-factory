name: CI

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

jobs:
  test:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Compile all source
        run: python -m compileall -q factory api tests cloud
      - name: Unit and contract tests
        run: python -m unittest discover -s tests -v
      - name: Secret and artifact preflight
        run: python scripts/repository_preflight.py
