name: Branch Hygiene

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-hygiene.yml
  pull_request:
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: branch-hygiene
  cancel-in-progress: false

jobs:
  sweep-stale-branches:
    name: Remove stale branches
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Delete every branch without an open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: main
        shell: bash
        run: |
          set -euo pipefail

          preserve_file="$(mktemp)"
          deleted_file="$(mktemp)"
          printf '%s\n' "$DEFAULT_BRANCH" > "$preserve_file"

          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
            --jq '.[] | select(.head.repo.full_name == .base.repo.full_name) | .head.ref' \
            >> "$preserve_file"

          sort -u -o "$preserve_file" "$preserve_file"
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

          while IFS= read -r branch; do
            [[ -n "$branch" ]] || continue
            [[ "$branch" == "HEAD" ]] && continue
            if grep -Fxq "$branch" "$preserve_file"; then
              echo "Preserving $branch"
              continue
            fi

            echo "Deleting stale branch: $branch"
            git push origin --delete "$branch"
            printf '%s\n' "$branch" >> "$deleted_file"
          done < <(
            git for-each-ref \
              --format='%(refname:strip=3)' \
              refs/remotes/origin \
              | sort -u
          )

          deleted_count="$(wc -l < "$deleted_file" | tr -d ' ')"
          {
            echo "## Branch cleanup"
            echo
            echo "Deleted **${deleted_count}** stale branches."
            echo
            echo "### Preserved"
            sed 's/^/- `/' "$preserve_file" | sed 's/$/`/'
            if [[ "$deleted_count" != "0" ]]; then
              echo
              echo "### Deleted"
              sed 's/^/- `/' "$deleted_file" | sed 's/$/`/'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  delete-merged-pr-branch:
    name: Delete merged PR branch
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Delete merged head branch
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$HEAD_BRANCH" == "main" ]]; then
            echo "Refusing to delete the default branch."
            exit 1
          fi

          if git ls-remote --exit-code --heads origin "$HEAD_BRANCH" >/dev/null 2>&1; then
            git push origin --delete "$HEAD_BRANCH"
            echo "Deleted merged branch: $HEAD_BRANCH" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Merged branch already absent: $HEAD_BRANCH" >> "$GITHUB_STEP_SUMMARY"
          fi
