name: PR 157 Exact Head Validation

on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: Exact PR #157 head SHA to validate
        required: true
        default: b2c4917c86706ed7d74a83e1e3a88fd4ce5a9c4c
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

env:
  TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event.pull_request.head.sha }}

concurrency:
  group: pr157-exact-head-validation
  cancel-in-progress: true

jobs:
  python:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 157
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - name: Verify exact PR head
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg runtime
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . coverage
      - name: Compile
        run: python -m compileall -q factory api tests cloud scripts
      - name: Unit and integration tests
        run: coverage run --branch -m unittest discover -s tests -v
      - name: Coverage report
        run: coverage report --fail-under=65
      - name: Repository preflight
        run: python scripts/repository_preflight.py

  renderer:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 157
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - name: Verify exact PR head
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: renderer/package.json
      - name: Install exact renderer dependencies
        working-directory: renderer
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: TypeScript build
        working-directory: renderer
        run: npm run build
      - name: Contract tests
        working-directory: renderer
        run: npm test

  canary:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 157
    needs: [python, renderer]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: modal-production
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - name: Verify exact checked-out SHA
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          echo "$TARGET_SHA" > exact-head-sha.txt
      - name: Reject stale PR head before GPU allocation
        run: |
          set -euo pipefail
          CURRENT_HEAD=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/157" \
            | python -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])')
          if [ "$CURRENT_HEAD" != "$TARGET_SHA" ]; then
            echo "Stale validation refused before Modal: target=$TARGET_SHA current=$CURRENT_HEAD"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "modal==1.5.3"
      - run: python scripts/repository_preflight.py
      - name: Invoke exact-head Gate-1 preproduction
        run: |
          set -o pipefail
          modal run -m cloud.modal_vimax_hitl_preproduction::app.prepare_vimax_keyframe_review --code-sha "$TARGET_SHA" | tee vimax-remotion-canary-result.txt
      - name: Parse structured Gate-1 result
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("vimax-remotion-canary-result.txt")
          if not path.is_file():
              raise SystemExit("Gate-1 stdout log is missing")
          prefix = "HITL_RESULT_JSON="
          lines = path.read_text(encoding="utf-8", errors="replace").splitlines()
          matches = [line[len(prefix):] for line in lines if line.startswith(prefix)]
          if not matches:
              raise SystemExit("Gate-1 stdout did not contain HITL_RESULT_JSON")
          payload = json.loads(matches[-1])
          if not isinstance(payload, dict):
              raise SystemExit("Gate-1 result must be a JSON object")
          Path("hitl-result.json").write_text(json.dumps(payload, indent=2, ensure_ascii=False), encoding="utf-8")
          print(json.dumps(payload, indent=2, ensure_ascii=False))
          PY
      - name: Recover exact-SHA Gate-1 result from Modal
        if: always()
        run: |
          set -u
          if [ -s hitl-result.json ]; then
            exit 0
          fi
          modal volume get --force ai-growth-factory-state "hitl-results/${TARGET_SHA}.json" hitl-result.json || true
      - name: Export complete canary directory from Modal
        if: always()
        run: |
          set -u
          if [ ! -s hitl-result.json ]; then
            echo "No structured Gate-1 result exists; canary export cannot be resolved." >&2
            exit 0
          fi
          CANARY=$(python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("hitl-result.json").read_text())
          print(str(payload.get("canary_id") or ""))
          PY
          )
          if [ -z "$CANARY" ]; then
            echo "Gate-1 result has no canary_id; retaining result/log evidence only."
            exit 0
          fi
          echo "$CANARY" > canary-id.txt
          mkdir -p canary-artifacts
          modal volume get --force ai-growth-factory-state "canaries/${CANARY}" canary-artifacts || true
          find canary-artifacts -type f -printf '%P\n' | sort || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr157-vimax-remotion-exact-head
          path: |
            exact-head-sha.txt
            canary-id.txt
            hitl-result.json
            vimax-remotion-canary-result.txt
            canary-artifacts
          retention-days: 14
      - name: Enforce release block after evidence export
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("hitl-result.json")
          if not path.is_file():
              raise SystemExit("Gate-1 failed without a recoverable structured result")
          payload = json.loads(path.read_text())
          status = str(payload.get("status") or "")
          decision = str(payload.get("release_decision") or "")
          print(f"Gate-1 status={status} release_decision={decision}")
          if status == "awaiting_human_keyframe_review":
              raise SystemExit("Gate-1 complete: release intentionally blocked pending human keyframe review")
          raise SystemExit(f"Gate-1 did not reach human review: {status} / {decision}")
          PY
