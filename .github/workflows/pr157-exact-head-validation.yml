name: PR 157 Exact Head Validation

on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: Exact PR #157 head SHA to validate
        required: true
        default: b2c4917c86706ed7d74a83e1e3a88fd4ce5a9c4c
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

env:
  TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event.pull_request.head.sha }}

concurrency:
  group: pr157-exact-head-validation
  cancel-in-progress: false

jobs:
  python:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 157
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - name: Verify exact PR head
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg runtime
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . coverage
      - name: Compile
        run: python -m compileall -q factory api tests cloud scripts
      - name: Unit and integration tests
        run: coverage run --branch -m unittest discover -s tests -v
      - name: Coverage report
        run: coverage report --fail-under=65
      - name: Repository preflight
        run: python scripts/repository_preflight.py

  renderer:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 157
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - name: Verify exact PR head
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: renderer/package.json
      - name: Install exact renderer dependencies
        working-directory: renderer
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: TypeScript build
        working-directory: renderer
        run: npm run build
      - name: Contract tests
        working-directory: renderer
        run: npm test

  canary:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 157
    needs: [python, renderer]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: modal-production
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - name: Verify exact PR head
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          echo "$TARGET_SHA" > exact-head-sha.txt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "modal==1.5.3"
      - run: python scripts/repository_preflight.py
      - name: Invoke exact-head ViMax + Remotion canary
        run: |
          set -o pipefail
          modal run cloud/modal_app.py --vimax-remotion-canary | tee vimax-remotion-canary-result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr157-vimax-remotion-exact-head
          path: |
            exact-head-sha.txt
            vimax-remotion-canary-result.txt
          retention-days: 14
