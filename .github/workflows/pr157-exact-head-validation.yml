name: PR 157 Exact Head Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr157-exact-head-validation
  cancel-in-progress: true

jobs:
  python:
    if: github.event.pull_request.number == 157
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact PR head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg runtime
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . coverage
      - name: Compile
        run: python -m compileall -q factory api tests cloud scripts
      - name: Unit and integration tests
        run: coverage run --branch -m unittest discover -s tests -v
      - name: Coverage report
        run: coverage report --fail-under=65
      - name: Repository preflight
        run: python scripts/repository_preflight.py

  renderer:
    if: github.event.pull_request.number == 157
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact PR head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: renderer/package.json
      - name: Install exact renderer dependencies
        working-directory: renderer
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: TypeScript build
        working-directory: renderer
        run: npm run build
      - name: Contract tests
        working-directory: renderer
        run: npm test

  canary:
    if: github.event.pull_request.number == 157
    needs: [python, renderer]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: modal-production
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact PR head
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          echo "${{ github.event.pull_request.head.sha }}" > exact-head-sha.txt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "modal==1.5.3"
      - run: python scripts/repository_preflight.py
      - name: Invoke exact-head ViMax + Remotion canary
        run: |
          set -o pipefail
          modal run cloud/modal_app.py --vimax-remotion-canary | tee vimax-remotion-canary-result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr157-vimax-remotion-exact-head
          path: |
            exact-head-sha.txt
            vimax-remotion-canary-result.txt
          retention-days: 14
